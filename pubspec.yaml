name: prorab_plus
description: "Прораб+ — управление строительными объектами, задачами, финансами и командой"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.5
  dio: ^5.7.0
  equatable: ^2.0.7
  file_picker: ^8.1.7
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.4
  go_router: ^14.2.7
  intl: ^0.19.0
  logger: ^2.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
