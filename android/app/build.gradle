import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.prorab.plus"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.prorab.plus"
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keyPropertiesFile = rootProject.file("key.properties")
            if (keyPropertiesFile.exists()) {
                def keyProperties = new Properties()
                keyPropertiesFile.withInputStream { keyProperties.load(it) }
                keyAlias = keyProperties['keyAlias']
                keyPassword = keyProperties['keyPassword']
                storeFile = keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
                storePassword = keyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTasks = taskGraph.allTasks.findAll { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (!releaseTasks.isEmpty() && !rootProject.file("key.properties").exists()) {
        throw new GradleException("android/key.properties is required for a production release build")
    }
}
