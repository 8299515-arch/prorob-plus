name: Format Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/google-play-ready'

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib test
      - run: git diff -- lib test > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
