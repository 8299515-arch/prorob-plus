name: Format Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/google-play-ready'

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatted Dart files
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart sources"
          git push
