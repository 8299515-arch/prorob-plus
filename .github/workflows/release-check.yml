name: Release Check

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable Gradle launcher
        run: chmod +x android/gradlew

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test --coverage

      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-release.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI Release, OU=Build, O=Prorab Plus, L=Kyiv, ST=Kyiv, C=UA"
          cat > android/key.properties <<'EOF'
          storePassword=changeit
          keyPassword=changeit
          keyAlias=ci-release
          storeFile=ci-release.jks
          EOF

      - name: Build Android release
        run: flutter build appbundle --release --no-pub
